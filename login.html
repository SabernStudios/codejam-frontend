<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | CodeJam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sharp-theme.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="icon" type="image/png" href="./assets/favicon.png?v=2">
    <script src="auth-nav.js" defer></script>
</head>
<body class="auth-page-body">
    <header class="home-header">
        <h1 class="header-site-name"><a class="header-link" href="index.html">CodeJam</a></h1>
        <nav class="header-nav">
            <a href="submissions.html">Submit</a>
            <a href="team-leaderboard.html">Leaderboard</a>
            <a href="rules.html">Rules</a>
        </nav>
        <a href="login.html" class="register-link">Sign in</a>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-copy">
                <p class="auth-eyebrow">Welcome back</p>
                <h1>Sign in to CodeJam.</h1>
                <p>
                    Sign in to submit your project, view your account status, like projects, and access judge tools if your account has judge permissions.
                </p>
            </div>

            <div class="auth-form-panel">
                <form id="login-form" class="auth-form">
                    <div class="auth-field">
                        <label for="username">Username</label>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            placeholder="JDoe1234"
                            minlength="2"
                            maxlength="39"
                            autocomplete="username">
                    </div>

                    <div class="auth-field">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="Enter your password"
                            minlength="8"
                            maxlength="72"
                            autocomplete="current-password">
                    </div>

                    <p id="login-status" class="auth-status" aria-live="polite"></p>
                    <button id="login-button" class="auth-submit-button" type="submit">Sign in</button>
                </form>

                <p class="auth-switch">Need an account? <a href="register.html">Create one</a></p>
            </div>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="login.js"></script>
</body>
</html>
