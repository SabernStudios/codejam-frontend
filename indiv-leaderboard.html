<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeJam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="home-header">
        <h1 class="header-site-name"><a class="header-link" href="home-signedin.html">CodeJam</a></h1>
        <nav class="header-nav">
            <a href="submit.html">Submit</a>
            <a href="leaderboard.html">Leaderboard</a>
            <a href="rules.html">Rules</a>
        </nav>
        <a href="sign-in.html" class="register-link">Sign in</a>
    </header>
    <div class="leaderboard-space">
        <h1 class="large-text">Leaderboard</h1>
        <div class="team-indiv-selector">
            <button class="selection-button button-styling"><a href="team-leaderboard.html">Team</a></button>
            <button class="selection-button button-styling"><a href="indiv-leaderboard.html">Indiv</a></button>
        </div>
        <label for="sort-by">Sort by: </label> <br>
        <select name="sort-by" id="sort-by">
            <option value="likes">Likes (default)</option>
            <option value="teamName">User Name (A-Z)</option>
            <option value="projName">Project Name (A-Z)</option>
            <option value="recent">Recent</option>
            <option value="old">Old</option>
        </select>
        <div class="leaderboard-categories">
            <h3 id="cat-team-name">User name</h3>
            <h3 id="cat-proj-name">Project name</h3>
            <h3 id="cat-likes">Likes</h3>
        </div>

        <br>

        <div class="submission1">
            <h3 id="sub1-user">Short Circuit</h3>
            <h3 id="sub1-proj-name">sample-proj</h3>
            <h3 id="sub1-likes">15</h3>
        </div>
    </div>

</body>
</html>
