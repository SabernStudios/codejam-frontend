<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeJam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="register-competitor-info">

        <h1>Register as a Competitor</h1>
        <div id="register-competitor-box">
            <p id="team-names-and-grades">Enter your team names and grades (up to 4):</p>
            <div class="team-member-fields">
                <input
                    type="text"
                    id="name"
                    name="name"
                    required
                    placeholder="Team member name"
                    minlength="2"
                    maxlength="50"/> 
                <select name="grade" id="grade">
                    <option value="9">9th</option>
                    <option value="10">10th</option>
                    <option value="11">11th</option>
                    <option value="12">12th</option>
                </select>
            </div>
            <button type="button" onclick="addField()">+</button>
            <button type="button" onclick="removeField()">-</button>
            
            <script>
                let amountPressed = 1;
                function addField() {
                    if (amountPressed < 4) {
                        const firstRow = document.querySelector(".team-member-fields");
                        const newRow = firstRow.cloneNode(true);
                        
                        newRow.querySelector("input").value = "";
                        newRow.querySelector("select").value = "9";
                        
                        const rows = document.querySelectorAll(".team-member-fields");
                        rows[rows.length - 1].after(newRow);

                        amountPressed++;
                    }
                }
                function removeField() {
                    if (amountPressed > 1) {                        
                        const rows = document.querySelectorAll(".team-member-fields");
                        rows[rows.length - 1].remove();
                        amountPressed--;
                    }
                }
            </script>

            <br>
            <br>
            <br>

            <label for="teamname">Enter your team name: </label> <br>
            <input
                type="text"
                id="teamname"
                name="teamname"
                required
                placeholder="Short Circuit"/>
            <br>
            <br>
            <br>

            <label for="email">Enter one of your team member's email (use your personal email, NOT your school email): </label> <br>
            <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="you@example.com"/>
            
            <br>
            <br>
            <br>
          
            <label for="password">Enter your password: </label> <br>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="At least 8 characters"
                required
                minlength="8"
                maxlength="32"
                autocomplete="current-password"
            >

            <br>
            <br>

            <label for="confirm-password">Confirm password: </label> <br>
            <input 
                type="password" 
                id="confirm-password"  
                placeholder="Confirm your password"
                required
                minlength="8"
                maxlength="32"
                autocomplete="current-password"
            >

            <script>                
                const password = document.getElementById("password");
                const confirmPassword = document.getElementById("confirm-password");

                function passwordEqual() {
                    if (password.value !== confirmPassword.value) {
                        confirmPassword.setCustomValidity("Passwords do not match");
                    } else {
                        confirmPassword.setCustomValidity("");
                    }
                }

                password.onchange = passwordEqual;
                confirmPassword.onkeyup = passwordEqual;
            </script>

            <br>
            <br>
            <br>
            <br>

            <button><a onclick="teamOrIndiv()">Register</a></button>

            <script>
                function teamOrIndiv() {
                    if (document.getElementById("category").value === "team") {
                        window.location.href= "team-registration.html";
                    } else {
                        window.location.href= "home.html";
                    }
                }

            </script>


        </div>
    </div>
</body>
</html>
