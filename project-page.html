<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeJam</title>
    <link rel="stylesheet" href="style.css">
    <script src="auth-nav.js" defer></script>
</head>
<body>
    <header class="home-header">
        <h1 class="header-site-name"><a class="header-link" href="index.html">CodeJam</a></h1>
        <nav class="header-nav">
            <a href="submissions.html">Submit</a>
            <a href="team-leaderboard.html">Leaderboard</a>
            <a href="rules.html">Rules</a>
        </nav>
        <a href="login.html" class="register-link">Sign in</a>
    </header>

    <div class="proj-names">
        <p id="team-name">Loading team...</p>
        <p id="team-members">Loading members...</p>
    </div>

    <div class="name-and-description">
        <h1 id="project-title">Loading project...</h1>
        <p id="description">Loading description...</p>
    </div>

    <div class="proj-links">
        <a id="github-url" target="_blank" rel="noopener noreferrer">Github link: Loading...</a>
        <a id="project-url" target="_blank" rel="noopener noreferrer">Website link: Loading...</a>
    </div>

    <div class="proj-place-button">
        <button id="score-button" class="scoring-button button-styling">Score Submission</button>
    </div>

    <script src="api.js"></script>
    <script src="project-page.js"></script>
</body>
</html>
