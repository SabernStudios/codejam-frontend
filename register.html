<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | CodeJam</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sharp-theme.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="icon" type="image/png" href="./assets/favicon.png?v=2">
    <script src="auth-nav.js" defer></script>
</head>
<body class="auth-page-body">
    <header class="home-header">
        <h1 class="header-site-name"><a class="header-link" href="index.html">CodeJam</a></h1>
        <nav class="header-nav">
            <a href="submissions.html">Submit</a>
            <a href="team-leaderboard.html">Leaderboard</a>
            <a href="rules.html">Rules</a>
        </nav>
        <a href="login.html" class="register-link">Sign in</a>
    </header>

    <main class="auth-page">
        <section class="auth-card">
            <div class="auth-copy">
                <p class="auth-eyebrow">Create account</p>
                <h1>Register for CodeJam.</h1>
                <p>
                    Make one account first. You can submit as an individual or as a team from the project submission page after signing in.
                </p>
            </div>

            <div class="auth-form-panel">
                <form id="register-form" class="auth-form">
                    <div class="auth-field">
                        <label for="name">Full name</label>
                        <input
                            type="text"
                            id="name"
                            name="name"
                            required
                            placeholder="John Doe"
                            minlength="2"
                            maxlength="80"
                            autocomplete="name">
                    </div>

                    <div class="auth-field">
                        <label for="username">Username</label>
                        <p class="auth-help">Use a name you can remember. You will use this to sign in.</p>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            required
                            placeholder="JDoe1234"
                            minlength="2"
                            maxlength="39"
                            autocomplete="username">
                    </div>

                    <div class="auth-field">
                        <label for="password">Password</label>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="At least 8 characters"
                            minlength="8"
                            maxlength="72"
                            autocomplete="new-password">
                    </div>

                    <div class="auth-field">
                        <label for="confirm-password">Confirm password</label>
                        <input
                            type="password"
                            id="confirm-password"
                            name="confirm-password"
                            required
                            placeholder="Retype your password"
                            minlength="8"
                            maxlength="72"
                            autocomplete="new-password">
                    </div>

                    <p id="register-status" class="auth-status" aria-live="polite"></p>
                    <button id="register-button" class="auth-submit-button" type="submit">Create account</button>
                </form>

                <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
            </div>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="register.js"></script>
</body>
</html>
