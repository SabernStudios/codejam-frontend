<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeJam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Frontend Stuff:
/register - Student registration page
/submit - Project submission page
/judge - Judge scoring page
/admin - Admin dashboard
/leaderboard - Results page 
-->
    <div class="register-competitor-info">

        <h1>Register as a Competitor</h1>
        <div class="register-competitior-box">
            <label for="username">Enter your username (this can be your real name): </label> <br>
            <input
                type="text"
                id="username"
                name="username"
                required
                placeholder="John Doe"
                minlength="2"
                maxlength="50"/>
            
            <br>
            <br>
            <br>

            <label for="email">Enter your email (use your personal email, NOT your school email): </label> <br>
            <input
                type="email"
                id="username"
                name="username"
                required
                placeholder="you@example.com"/>
            
            <br>
            <br>
            <br>

            <label for="grade">Enter your grade: </label> <br>
            <select name="grade" id="grade">
                <option value="9">9th</option>
                <option value="10">10th</option>
                <option value="11">11th</option>
                <option value="12">12th</option>
            </select>

            <br>
            <br>
            <br>

            <label for="category">Team or individual: </label> <br>
            <select name="category" id="category">
                <option value="team">Team</option>
                <option value="indiv">Individual</option>
            </select>

            <br>
            <br>
            <br>

            <label for="password">Enter your password: </label> <br>
            <input 
                type="password" 
                id="password" 
                name="password" 
                placeholder="At least 8 characters"
                required
                minlength="8"
                maxlength="32"
                autocomplete="current-password"
            >

            <br>
            <br>

            <label for="confirm-password">Confirm password: </label> <br>
            <input 
                type="password" 
                id="confirm-password"  
                placeholder="Confirm your password"
                required
                minlength="8"
                maxlength="32"
                autocomplete="current-password"
            >

            <script>                
                const password = document.getElementById("password");
                const confirmPassword = document.getElementById("confirm-password");

                function passwordEqual() {
                    if (password.value !== confirmPassword.value) {
                        confirmPassword.setCustomValidity("Passwords do not match");
                    } else {
                        confirmPassword.setCustomValidity("");
                    }
                }

                password.onchange = passwordEqual;
                confirmPassword.onkeyup = passwordEqual;
            </script>

            <br>
            <br>
            <br>
            <br>

            <button><a onclick="teamOrIndiv()">Register</a></button>

            <script>
                function teamOrIndiv() {
                    if (document.getElementById("category").value === "team") {
                        window.location.href= "team-registration.html";
                    } else {
                        window.location.href= "home.html";
                    }
                }

            </script>


        </div>
    </div>
