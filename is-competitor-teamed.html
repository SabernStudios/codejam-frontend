<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeJam</title>
    <link rel="stylesheet" href="style.css">
    <script src="border-glow.js" defer></script>
</head>
<body>
    <div class="register-h1">
        <h1>Are you participating individually or in a team?</h1>
    </div>

    <div class="register-selection">
        <a href="register-competitor-indiv.html">
            <div class="border-glow-card" data-animated="true">
                <span class="edge-light" aria-hidden="true"></span>
                <div class="border-glow-inner">
                    <img class="register-selection-images" src="assets/landscape-placeholder-svgrepo-com.png">
                    <h1 class="register-selection-option">Individual</h1>
                </div>
            </div>
        </a>
        <a href="register-competitor-team.html">
            <div class="border-glow-card" data-animated="true">
                <span class="edge-light" aria-hidden="true"></span>
                <div class="border-glow-inner">
                    <img class="register-selection-images" src="assets/landscape-placeholder-svgrepo-com.png">
                    <h1 class="register-selection-option">In a team</h1>
                </div>
            </div>
        </a>
    </div>

</body>
</html>
