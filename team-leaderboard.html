<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeJam Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="leaderboard.css">
    <script src="auth-nav.js" defer></script>
</head>
<body>
    <header class="home-header">
        <h1 class="header-site-name"><a class="header-link" href="index.html">CodeJam</a></h1>
        <nav class="header-nav">
            <a href="submissions.html">Submit</a>
            <a href="team-leaderboard.html">Leaderboard</a>
            <a href="rules.html">Rules</a>
        </nav>
        <a href="login.html" class="register-link">Sign in</a>
    </header>

    <main class="leaderboard-page">
        <section class="leaderboard-hero">
            <p class="leaderboard-eyebrow">Schoolwide CodeJam</p>
            <h1>Leaderboard</h1>
            <p class="leaderboard-subtitle">
                Track submitted projects, scores, and finalists as CodeJam progresses.
            </p>
        </section>

        <section class="leaderboard-panel">
            <div class="leaderboard-toolbar">
                <div>
                    <p class="toolbar-label">Projects</p>
                    <h2 id="leaderboard-count">Loading...</h2>
                </div>

                <label class="sort-control" for="sort-by">
                    <span>Sort by</span>
                    <select name="sort-by" id="sort-by">
                        <option value="score">Score, high to low</option>
                        <option value="project">Project name</option>
                        <option value="team">User/team name</option>
                        <option value="category">Category</option>
                    </select>
                </label>
            </div>

            <p id="leaderboard-status" class="leaderboard-status">Loading leaderboard...</p>
            <div id="leaderboard-list" class="leaderboard-list" aria-live="polite"></div>
        </section>
    </main>

    <script src="api.js"></script>
    <script src="leaderboard.js"></script>
</body>
</html>
